name: Check visa links

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Check 195 visa links
        run: node check-links.mjs

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-visa-link-report
          path: link-report.csv
          if-no-files-found: warn
